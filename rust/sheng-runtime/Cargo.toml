[package]
name = "sheng-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Session runtime for the sheng engine: configuration, catalogs, transport, audio and translation pipeline"

[features]
# Exposes the scripted fake provider to other crates' tests (step 3 ABI tests).
test-support = []

[dependencies]
sheng-core = { path = "../sheng-core" }
aec-rs-sys = "=1.0.0"
# Generic encoding, signing and identity helpers shared by the step 4 service clients.
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
percent-encoding = "2"
rand = "0.9"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[dev-dependencies]
sheng-runtime = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
